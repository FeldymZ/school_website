# =========================
# HTTP → HTTPS REDIRECTION
# =========================
server {
    listen 80;
    server_name api-test.esiitech-gabon.com;
    return 301 https://$host$request_uri;
}

# =========================
# HTTPS + API + CORS
# =========================
server {
    listen 443 ssl;
    server_name api-test.esiitech-gabon.com;

    ssl_certificate /etc/ssl/esiitech/fullchain.pem;
    ssl_certificate_key /etc/ssl/esiitech/STAR.esiitech-gabon.com_key.txt;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # =========================
    # ASSETS (images, fichiers)
    # =========================
    location /assets/ {
        alias /var/www/assets/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # =========================
    # API SPRING BOOT
    # =========================
    location / {

        proxy_pass http://school_api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # =========================
        # 🔥 CORS (CRITIQUE)
        # =========================
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # =========================
        # 🔥 PREFLIGHT (OPTIONS)
        # =========================
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:5173";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Access-Control-Allow-Credentials "true";
            return 204;
        }
    }
}
