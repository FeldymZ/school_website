version: "3.9"

services:

  db:
    image: postgres:17
    container_name: school-db
    restart: always
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: school-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: always

volumes:
  postgres_data:
