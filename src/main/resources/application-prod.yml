server:
  port: 8080

spring:
  application:
    name: school-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 50MB

storage:
  upload-dir: uploads

# =========================
# APP (URL ABSOLUE API)
# =========================
app:
  base-url: https://api-test.esiitech-gabon.com
