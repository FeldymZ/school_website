server:
  port: 8080

spring:
  application:
    name: school-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Paris   # ⚠️ Africa/Libreville = vrai GMT+1 toute l'année

  jackson:
    time-zone: Europe/Paris        # ⚠️ Africa/Libreville = vrai GMT+1 toute l'année

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
            checkserveridentity: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

storage:
  upload-dir: uploads

app:
  public-url: https://api-test.esiitech-gabon.com
  mail:
    from: "ESIITech Gabon <noreply@esiitech-gabon.com>"
  notifications:
    slack-webhook: ${SLACK_WEBHOOK_URL}

  # ===== DEVIS FORMATION CONTINUE =====
  # (le validateur, sa signature et son cachet sont gérés dans « Validateurs des devis »)
  devis:
    ecole:
      decrets: "Décrets N°0071/PR/MESRSIT et 0072/PR/MESRSIT du 24/02/2024"
      adresse: "Derrière le Palais de justice-BP : 20308 Libreville-Gabon   Téléphone +241 076237638"
      email: "contact@esiitech-gabon.com"
      site: "www.esiitech-gabon.com"
    # ✅ même fichier que l'attestation de préinscription (lu directement sur le disque du serveur)
    logo: "/app/assets/logo.png"
    objet: "Formation"
    devise: "XAF"
    validite-jours: 30
    paiement:
      beneficiaire: "Payable à 100% à l'ordre de l'ESIITECH-GABON"
      mode: "Mode de paiement : Chèque ou virement"
      banque: "UGB"
      rib: "40002 00004 90000755798-66"