server:
  port: 8080

spring:
  application:
    name: school-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

          # 🔥 FIX PROBLÈME CERTIFICAT
          ssl:
            trust: "*"
            checkserveridentity: false

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

storage:
  upload-dir: uploads

app:
  public-url: https://api-test.esiitech-gabon.com
  mail:
    from: "ESIITech Gabon <noreply@esiitech-gabon.com>"
  notifications:
    slack-webhook: ${SLACK_WEBHOOK_URL}